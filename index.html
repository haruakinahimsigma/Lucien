<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f6f1">
<meta name="description" content="Lucien — a little clarity goes a long way.">
<title>Lucien — A little clarity goes a long way</title>
<style>
:root{color-scheme:light;--page:#faf9f6;--sidebar:#f2f0ea;--panel:#fffefa;--ink:#282722;--muted:#858176;--line:#e7e3da;--accent:#bd795f;--accent-soft:#f2e5dc;--hover:#eae6de;--shadow:0 12px 40px #3127190a}
:root[data-theme="dark"]{color-scheme:dark;--page:#20201e;--sidebar:#191a18;--panel:#292a27;--ink:#f2f0e9;--muted:#a8a397;--line:#3b3b36;--accent:#d39a80;--accent-soft:#49352d;--hover:#30312d;--shadow:0 12px 40px #00000020}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;min-height:100vh;transition:background .2s,color .2s}button,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.app{display:flex;min-height:100vh}.sidebar{width:252px;flex:0 0 252px;background:var(--sidebar);padding:25px 15px 16px;display:flex;flex-direction:column;border-right:1px solid var(--line);transition:transform .25s,background .2s}.brand{display:flex;align-items:center;gap:10px;padding:0 9px 28px;font-size:19px;font-weight:650;letter-spacing:-.7px}.logo{width:29px;height:29px;display:grid;place-items:center;color:var(--accent)}.logo svg{width:28px;height:28px}.new-chat{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);text-align:left;font-weight:550}.new-chat:hover,.side-action:hover,.history-item:hover{background:var(--hover)}.plus{font-size:19px;font-weight:300;color:var(--accent)}.section-label{margin:28px 10px 9px;color:var(--muted);font-size:11px;font-weight:650;letter-spacing:1.1px;text-transform:uppercase}.history{display:flex;flex-direction:column;gap:3px}.history-item{border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}.history-item.active{background:var(--hover)}.sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding-top:20px}.side-action{border:0;background:transparent;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 11px;border-radius:9px;color:var(--muted)}.side-action svg{width:17px;height:17px}.profile{display:flex;align-items:center;gap:10px;margin-top:17px;padding:14px 8px 0;border-top:1px solid var(--line)}.avatar{height:32px;width:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:650}.profile-name{font-size:12px;font-weight:600}.profile-sub{font-size:11px;color:var(--muted);margin-top:3px}.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 31px;border-bottom:1px solid var(--line)}.model-label{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}.model-label span{color:var(--muted);font-weight:400}.top-actions{display:flex;align-items:center;gap:8px}.icon-button{border:0;background:transparent;border-radius:9px;width:37px;height:37px;display:grid;place-items:center;color:var(--muted)}.icon-button:hover{background:var(--hover);color:var(--ink)}.icon-button svg{width:18px;height:18px}.mobile-menu{display:none}.content{width:min(790px,calc(100% - 48px));margin:0 auto;flex:1;display:flex;flex-direction:column;align-items:stretch;padding:clamp(60px,12vh,125px) 0 32px}.welcome{text-align:center;margin-bottom:39px;animation:rise .6s ease both}.welcome-mark{width:43px;height:43px;margin:0 auto 23px;color:var(--accent)}.welcome-mark svg{width:100%;height:100%}h1{font-size:clamp(30px,4vw,43px);letter-spacing:-1.7px;line-height:1.15;font-weight:570;margin:0 0 14px}.welcome p{margin:0;color:var(--muted);font-size:15px;line-height:1.6}.composer{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:16px 16px 12px;box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}.composer:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 10%,transparent),var(--shadow)}textarea{display:block;width:100%;resize:none;min-height:57px;max-height:220px;border:0;outline:none;background:transparent;color:var(--ink);line-height:1.55;font-size:15px;padding:3px 2px 12px}textarea::placeholder{color:#9a9589}.composer-footer{display:flex;align-items:center;justify-content:space-between}.composer-tools{display:flex;gap:6px}.tool-button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:7px 9px;display:flex;align-items:center;gap:7px;font-size:12px}.tool-button:hover{background:var(--hover);color:var(--ink)}.tool-button svg{width:16px;height:16px}.send-button{width:35px;height:35px;display:grid;place-items:center;background:var(--ink);color:var(--page);border:0;border-radius:11px;transition:transform .15s,opacity .15s}.send-button:hover{transform:translateY(-1px);opacity:.85}.send-button:disabled{opacity:.3;cursor:not-allowed;transform:none}.send-button svg{width:17px;height:17px}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}.suggestion{background:transparent;border:1px solid var(--line);border-radius:13px;padding:14px 15px;text-align:left;transition:background .2s,border-color .2s}.suggestion:hover{background:var(--panel);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}.suggestion strong{display:block;font-size:12px;font-weight:600;margin-bottom:5px}.suggestion span{font-size:12px;line-height:1.45;color:var(--muted)}.conversation{display:flex;flex-direction:column;gap:25px;margin-bottom:28px;animation:rise .25s ease both}.message{line-height:1.75;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{align-self:flex-end;max-width:85%;background:var(--accent-soft);padding:12px 16px;border-radius:17px 17px 5px 17px}.message.assistant{align-self:stretch;padding:0 4px}.message-label{font-size:11px;font-weight:650;color:var(--muted);margin-bottom:8px;letter-spacing:.3px}.message.assistant p{margin:0 0 12px}.message.assistant p:last-child{margin-bottom:0}.typing{color:var(--muted);font-size:13px}.footnote{text-align:center;color:var(--muted);font-size:11px;line-height:1.5;margin:15px 0 0}.status{font-size:11px;color:var(--muted);text-align:center;margin-top:16px}.empty-hidden{display:none!important}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:var(--ink);color:var(--page);padding:10px 15px;border-radius:11px;font-size:12px;transition:all .2s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@media(max-width:760px){.sidebar{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-105%);box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.mobile-menu{display:grid}.topbar{padding:0 16px;height:58px}.content{width:calc(100% - 32px);padding-top:clamp(55px,10vh,90px)}.welcome{margin-bottom:30px}.suggestions{grid-template-columns:1fr}.suggestion{padding:12px 14px}.suggestion span{font-size:11px}.tool-button .tool-label{display:none}.model-label{font-size:12px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar" aria-label="Main navigation">
  <div class="brand"><div class="logo"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 2.5 19.6 12.4 29.5 16l-9.9 3.6L16 29.5l-3.6-9.9L2.5 16l9.9-3.6L16 2.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="16" cy="16" r="2.1" fill="currentColor"/></svg></div>lucien</div>
  <button class="new-chat" id="newChat"><span class="plus">＋</span> New chat <span style="margin-left:auto;color:var(--muted);font-size:11px">⌘ K</span></button>
  <div class="section-label">Your space</div>
  <div class="history" id="history"><div style="padding:10px 11px;color:var(--muted);font-size:12px">Your conversations will appear here.</div></div>
  <div class="sidebar-bottom">
    <button class="side-action" id="themeSide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20.5 15.3A8.7 8.7 0 0 1 8.7 3.5 8.8 8.8 0 1 0 20.5 15.3Z"/></svg><span>Appearance</span></button>
    <button class="side-action" id="aboutBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></svg><span>About Lucien</span></button>
    <div class="profile"><div class="avatar">L</div><div><div class="profile-name">Your workspace</div><div class="profile-sub">A little clarity goes a long way.</div></div></div>
  </div>
</aside>
<main class="main">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:9px"><button class="icon-button mobile-menu" id="menuBtn" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div class="model-label">Lucien <span>· Preview</span></div></div>
    <div class="top-actions"><button class="icon-button" id="themeBtn" aria-label="Toggle dark mode" title="Toggle appearance"><svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20.5 15.3A8.7 8.7 0 0 1 8.7 3.5 8.8 8.8 0 1 0 20.5 15.3Z"/></svg></button></div>
  </header>
  <section class="content">
    <div class="welcome" id="welcome">
      <div class="welcome-mark"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M24 3.5 29.1 18.9 44.5 24l-15.4 5.1L24 44.5l-5.1-15.4L3.5 24l15.4-5.1L24 3.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="24" cy="24" r="3" fill="currentColor"/></svg></div>
      <h1>What can I help with?</h1>
      <p>Ask anything. We'll figure it out.</p>
    </div>
    <div id="conversation" class="conversation empty-hidden" aria-live="polite"></div>
    <form id="composer" class="composer">
      <textarea id="prompt" rows="2" placeholder="Message Lucien..." aria-label="Message Lucien"></textarea>
      <div class="composer-footer">
        <div class="composer-tools"><button class="tool-button" type="button" id="focusBtn" title="Focus the message box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/></svg><span class="tool-label">Just start typing</span></button></div>
        <button class="send-button" id="sendBtn" type="submit" aria-label="Send message" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5m-7 7 7-7 7 7"/></svg></button>
      </div>
    </form>
    <div class="suggestions" id="suggestions">
      <button class="suggestion" data-prompt="Help me understand a difficult topic, step by step."><strong>Learn something</strong><span>Make a tricky idea feel simple.</span></button>
      <button class="suggestion" data-prompt="Help me brainstorm a few creative ideas for a project."><strong>Explore an idea</strong><span>Start with a blank page and see where it goes.</span></button>
      <button class="suggestion" data-prompt="Help me make a realistic plan for something I want to achieve."><strong>Make a plan</strong><span>Turn a big goal into small next steps.</span></button>
      <button class="suggestion" data-prompt="Help me write something clearly and naturally."><strong>Write together</strong><span>Find the right words for what you mean.</span></button>
    </div>
    <p class="footnote" id="footnote">A calm place to think things through. Lucien is still learning.</p>
  </section>
</main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const promptBox=$('#prompt'), sendBtn=$('#sendBtn'), conversation=$('#conversation'), welcome=$('#welcome'), suggestions=$('#suggestions'), footnote=$('#footnote');
let chats=[],activeChat=null,toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2500)}
function setTheme(theme){document.documentElement.dataset.theme=theme;localStorage.setItem('lucien-theme',theme);$('#themeIcon').innerHTML=theme==='dark'?'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>':'<path d="M20.5 15.3A8.7 8.7 0 0 1 8.7 3.5 8.8 8.8 0 1 0 20.5 15.3Z"/>'}
function toggleTheme(){setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')}
setTheme(localStorage.getItem('lucien-theme')||'light');
$('#themeBtn').addEventListener('click',toggleTheme);$('#themeSide').addEventListener('click',toggleTheme);
function renderHistory(){const el=$('#history');el.innerHTML='';if(!chats.length){el.innerHTML='<div style="padding:10px 11px;color:var(--muted);font-size:12px">Your conversations will appear here.</div>';return}chats.slice().reverse().forEach(c=>{const b=document.createElement('button');b.className='history-item'+(c.id===activeChat?' active':'');b.textContent=c.title;b.title=c.title;b.onclick=()=>openChat(c.id);el.appendChild(b)})}
function newChat(){activeChat=null;conversation.innerHTML='';conversation.classList.add('empty-hidden');welcome.classList.remove('empty-hidden');suggestions.classList.remove('empty-hidden');footnote.classList.remove('empty-hidden');promptBox.value='';autoSize();renderHistory();promptBox.focus();$('#sidebar').classList.remove('open')}
function openChat(id){activeChat=id;const c=chats.find(x=>x.id===id);if(!c)return;welcome.classList.add('empty-hidden');suggestions.classList.add('empty-hidden');footnote.classList.add('empty-hidden');conversation.classList.remove('empty-hidden');conversation.innerHTML='';c.messages.forEach(m=>addMessage(m.role,m.content));renderHistory();$('#sidebar').classList.remove('open')}
function addMessage(role,content){const div=document.createElement('div');div.className='message '+role;if(role==='assistant'){const label=document.createElement('div');label.className='message-label';label.textContent='LUCIEN';div.appendChild(label)}const body=document.createElement(role==='assistant'?'div':'span');if(role==='assistant'){content.split(/\n\n+/).forEach(p=>{const para=document.createElement('p');para.textContent=p;body.appendChild(para)})}else body.textContent=content;div.appendChild(body);conversation.appendChild(div);return div}
function autoSize(){promptBox.style.height='auto';promptBox.style.height=Math.min(promptBox.scrollHeight,220)+'px';sendBtn.disabled=!promptBox.value.trim()}
promptBox.addEventListener('input',autoSize);promptBox.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#composer').requestSubmit()}});
$('#composer').addEventListener('submit',async e=>{e.preventDefault();const text=promptBox.value.trim();if(!text)return;if(!activeChat){activeChat=Date.now().toString();chats.push({id:activeChat,title:text.length> thirty ? text.slice(0,thirty)+'…':text,messages:[]})}const c=chats.find(x=>x.id===activeChat);c.messages.push({role:'user',content:text});if(c.messages.length===1)c.title=text.length>36?text.slice(0,36)+'…':text;welcome.classList.add('empty-hidden');suggestions.classList.add('empty-hidden');footnote.classList.add('empty-hidden');conversation.classList.remove('empty-hidden');addMessage('user',text);promptBox.value='';autoSize();renderHistory();const thinking=document.createElement('div');thinking.className='message assistant';thinking.innerHTML='<div class="message-label">LUCIEN</div><div class="typing">Thinking this through…</div>';conversation.appendChild(thinking);thinking.scrollIntoView({behavior:'smooth',block:'end'});try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:c.messages})});const data=await res.json();if(!data.reply)throw new Error('empty reply');const reply=String(data.reply);thinking.remove();c.messages.push({role:'assistant',content:reply});addMessage('assistant',reply)}catch(err){thinking.remove();const reply='I’m here, but my AI brain isn’t connected yet. This interface is ready; the next step is to connect a model API on the server. Once that is configured, your messages will get real AI responses.';addMessage('assistant',reply);c.messages.push({role:'assistant',content:reply});toast('AI connection not set up yet')}renderHistory();conversation.lastElementChild?.scrollIntoView({behavior:'smooth',block:'end'})});
const thirty=36;
$('#newChat').addEventListener('click',newChat);$('#focusBtn').addEventListener('click',()=>promptBox.focus());document.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>{promptBox.value=b.dataset.prompt;autoSize();promptBox.focus()}));$('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));$('#aboutBtn').addEventListener('click',()=>toast('Lucien — a little clarity goes a long way.'));document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();newChat()}if(e.key==='Escape')$('#sidebar').classList.remove('open')});
renderHistory();
</script>
</body>
</html>
